
# Table 3: Geometry and loading parameters
geometry:
  l: {value: 800, unit: mm, source: "Table 3"}
  b: {value: 390, unit: mm, source: "Table 3"}

# boundary condition defined
boundary_conditions: "simply supported on lower edges (Sec 5)"

# Table 3: bending deflection coefficient and shear deflection coefficient
beam_coefficients:
  k_b: {value: 0.0130208333, unit: "", source: "Table 3, = 5/384"}
  k_s: {value: 0.125,        unit: "", source: "Table 3, = 1/8"}

# Table 3: design load (MPa)
nominal_case:
  p: {value: 0.004142, unit: MPa, source: "Table 3"}
  note: "Nominal design load. P, M_max and F derived in solver.py. MCS range in design_space.yaml"

# Material codes for layup definition, where each code keys material
material_codes:
  1: CFRP
  2: GFRP
  3: Al

# Table 6: key design points for FEM solution table transcribed, correspond to different objectives (min weight, min cost, knee point)
reference_designs:
  min_weight:
    layup: [1, 1, 1, 1, 1, 1]
    tc:    {value: 15.21, unit: mm,      source: "Table 6"}
    tf:    {value: 0.75,  unit: mm,      source: "Table 6"}
    rho_c: {value: 37,    unit: kg/m**3, source: "Table 6"}
    objectives:
      Wt: {value: 1.88, unit: kg, source: "Table 6"}
      Ct: {value: 2.41, unit: "", source: "Table 6"}
    note: "Totally CFRP"

  min_cost:
    layup: [3, 3, 3, 3, 3, 3]
    tc:    {value: 17.46, unit: mm,      source: "Table 6"}
    tf:    {value: 1.2,   unit: mm,      source: "Table 6"}
    rho_c: {value: 29,    unit: kg/m**3, source: "Table 6"}
    objectives:
      Wt: {value: 4.65, unit: kg, source: "Table 6"}
      Ct: {value: 1.53, unit: "", source: "Table 6"}
    note: "Totally Al"

  knee_point:
    layup: [3, 1, 1, 2, 1, 2]
    tc:    {value: 17.93, unit: mm,      source: "Table 6"}
    tf:    {value: 0.825, unit: mm,      source: "Table 6"}
    rho_c: {value: 29,    unit: kg/m**3, source: "Table 6"}
    objectives:
      Wt: {value: 2.1,  unit: kg, source: "Table 6"}
      Ct: {value: 2.39, unit: "", source: "Table 6"}
    note: "FML"

# Table 5: Pareto points design from base paper, transcriped in published order
# Rows 1, 6 and 18 are the three key designs repeated in Table 6
# (min weight, knee point, min cost)
pareto_designs:
  source: "Table 5"
  rows:
    - {n:  1, rho_c: 37, tc: 15.21, layup: [1,1,1,1,1,1], Ct: 2.41, Wt: 1.88, note: "min weight"}
    - {n:  2, rho_c: 37, tc: 16.49, layup: [1,1,1,2,1,1], Ct: 2.35, Wt: 1.95}
    - {n:  3, rho_c: 37, tc: 17.88, layup: [2,1,1,2,1,1], Ct: 2.29, Wt: 2.02}
    - {n:  4, rho_c: 29, tc: 16.18, layup: [1,1,1,3,1,1], Ct: 2.23, Wt: 2.27}
    - {n:  5, rho_c: 29, tc: 16.95, layup: [1,1,1,3,1,2], Ct: 2.17, Wt: 2.32}
    - {n:  6, rho_c: 29, tc: 17.93, layup: [3,1,1,2,1,2], Ct: 2.10, Wt: 2.39, note: "knee point"}
    - {n:  7, rho_c: 29, tc: 17.12, layup: [3,1,1,3,1,2], Ct: 2.02, Wt: 2.80}
    - {n:  8, rho_c: 29, tc: 16.80, layup: [2,1,1,3,1,3], Ct: 2.02, Wt: 2.81}
    - {n:  9, rho_c: 29, tc: 18.31, layup: [3,1,2,3,1,2], Ct: 1.96, Wt: 2.87}
    - {n: 10, rho_c: 29, tc: 18.00, layup: [2,1,2,3,1,3], Ct: 1.95, Wt: 2.88}
    - {n: 11, rho_c: 29, tc: 16.30, layup: [3,1,1,3,1,3], Ct: 1.95, Wt: 3.22}
    - {n: 12, rho_c: 29, tc: 17.00, layup: [3,1,2,3,1,3], Ct: 1.87, Wt: 3.28}
    - {n: 13, rho_c: 37, tc: 18.08, layup: [3,2,2,3,1,3], Ct: 1.85, Wt: 3.44}
    - {n: 14, rho_c: 29, tc: 17.34, layup: [3,1,1,3,3,3], Ct: 1.81, Wt: 3.72}
    - {n: 15, rho_c: 29, tc: 17.31, layup: [3,2,3,3,1,3], Ct: 1.73, Wt: 3.77}
    - {n: 16, rho_c: 29, tc: 17.36, layup: [3,1,3,3,3,3], Ct: 1.67, Wt: 4.19}
    - {n: 17, rho_c: 29, tc: 17.63, layup: [2,3,3,3,3,3], Ct: 1.60, Wt: 4.24}
    - {n: 18, rho_c: 29, tc: 17.46, layup: [3,3,3,3,3,3], Ct: 1.53, Wt: 4.65, note: "min cost"}

  # tc = core thickness
  # face sheet materials defined using material codes
  # Ct = unit cost, with unit price assumed
  # Wt = weight of sandwich panel 
  units:
    rho_c: kg/m**3
    tc: mm
    Ct: ""        
    Wt: kg
  
# Knee point design (most satisfactory solution)
published_results:
  knee_weight: {value: 2.1,  unit: kg, source: "Table 6"}
  knee_cost:   {value: 2.39, unit: "", source: "Table 6"}

# number of simulations run (9000), and seed for reproducibility 
run:
  seed: 42
  n_samples: 9000 