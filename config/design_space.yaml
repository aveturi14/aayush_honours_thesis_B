# Design variables and constraint thresholds.
# Everything the Monte Carlo varies, plus what samples are checked against.

continuous:
  core_thickness:
    min: {value: 5, unit: mm, source: "Table 4"}
    max: {value: 20, unit: mm, source: "Table 4"}
  applied_load:
    min: {value: 0.0024, unit: MPa, source: "Sec 3.1"}
    max: {value: 0.0048, unit: MPa, source: "Sec 3.1"}

discrete:
  core_density:
    values: [29, 37, 42, 54, 59, 83]   # six values; must match keys in materials.yaml
    unit: kg/m**3
    source: "Table 2"
  layer_material:
    values: [1, 2, 3]  # codes defined in problem.yaml
    n_layers: 6
    source: "Table 4"

constraints:
  max_total_thickness:  {value: , unit: mm, source: "Eq 25"}
  max_deflection_ratio: {value: , unit: "", source: "Eq 24"}
  min_safety_factor:    {value: , unit: "", source: "Eqs 22-25"}

layer_material:
  values: [1, 2, 3]
  n_layers: 6
  source: "Table 4"
  note: "Codes defined in problem.yaml material_codes"