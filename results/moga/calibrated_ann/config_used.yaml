surrogate:
  model_dir: models/ann_baseline
  scalers: data/processed/scalers.json
algorithm:
  name: NSGA2
  n_evaluations: 23000
  pop_size: 50
  selection: random
  crossover:
    type: SBX
    prob: 0.9
    eta: 30
  mutation:
    type: PM
    prob: 0.9
    prob_var: 0.125
    eta: 20
  eliminate_duplicates: true
  duplicate_tolerance: 1.0e-06
  seed: 1
metrics:
  hv_reference:
  - 5.0
  - 2.6
targets:
  pareto_size: 18
  knee_row: 6
feasibility:
  constraints_from: ann
  report_only_feasible: false
output_dir: results/moga/default
